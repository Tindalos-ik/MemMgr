name: memmgr
services:
  chroma:
    image: chromadb/chroma:1.5.3
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8000; printf 'GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r line <&3; [[ $$line == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
volumes:
  chroma_data:
    name: memmgr_chroma_data
